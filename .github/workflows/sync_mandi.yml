name: Sync Daily Mandi Prices to Firestore

on:
  schedule:
    # Runs 4 times a day: 07:45 AM IST (02:15 UTC), 11:45 AM IST (06:15 UTC), 03:45 PM IST (10:15 UTC), 07:45 PM IST (14:15 UTC)
    # Using minute 15 to avoid GitHub Actions top-of-the-hour queue drops
    - cron: '15 2,6,10,14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  sync-mandi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin

      - name: Run Mandi Sync Script
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/sync_mandi.py
