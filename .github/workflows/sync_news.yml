name: Sync Local News to Firestore

on:
  schedule:
    # Runs 3 times every day: 07:30 AM IST (02:00 UTC), 01:30 PM IST (08:00 UTC), and 07:30 PM IST (14:00 UTC)
    - cron: '0 2,8,14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin

      - name: Run News Sync Script
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEWS_QUERY: "Maharajganj"
        run: |
          python scripts/sync_news.py
